name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Android Project
        run: |
          echo "Syncing web dist assets into Android project..."
          if [ -d "android" ]; then
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/ || true
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
            cd ..
          else
            echo "Gradle wrapper not found in root or android folder, attempting gradle build in android directory..."
            if [ -d "android" ]; then
              cd android
              gradle assembleDebug --stacktrace || true
              cd ..
            fi
          fi

      - name: Verify and Collect Generated APK
        id: find_apk
        run: |
          mkdir -p output-apk
          APK_FILE=$(find . -type f -name "*debug*.apk" ! -path "*/output-apk/*" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            # Search any apk
            APK_FILE=$(find . -type f -name "*.apk" ! -path "*/output-apk/*" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" output-apk/SmartFridge-debug.apk
            echo "apk_path=output-apk/SmartFridge-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_found=true" >> $GITHUB_OUTPUT
          else
            echo "APK build file not found!"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFridge-debug-apk
          path: output-apk/SmartFridge-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag & Version
        id: release_tag
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=Android Debug APK $TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: steps.find_apk.outputs.apk_found == 'true'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: ${{ steps.release_tag.outputs.release_title }}
          draft: false
          prerelease: false
          files: output-apk/SmartFridge-debug.apk
          body: |
            ### 📱 Smart Fridge & Culinary Assistant — Android Debug APK
            
            **Automated Build by GitHub Actions**
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Run Number**: `#${{ github.run_number }}`
            
            #### ⬇️ Direct Download Link
            You can download and install this APK directly on your Android phone:
            - **Direct APK Download**: [`SmartFridge-debug.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag_name }}/SmartFridge-debug.apk)
            
            ---
            *Note: To install on Android, allow "Install from Unknown Sources" or tap "Install anyway" when prompted.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Direct Download URL
        run: |
          echo "=========================================================="
          echo "🎉 Android Debug APK Successfully Built!"
          echo "Direct Download Link:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag_name }}/SmartFridge-debug.apk"
          echo "=========================================================="
