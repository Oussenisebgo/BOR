<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="door" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Inner Glow & Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />

  <!-- Stylized Fridge Body -->
  <rect x="120" y="80" width="272" height="352" rx="36" fill="url(#door)" stroke="#10b981" stroke-width="10" filter="url(#shadow)" />
  
  <!-- Freezer / Fridge Divider -->
  <line x1="120" y1="200" x2="392" y2="200" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  
  <!-- Handles -->
  <rect x="145" y="125" width="12" height="50" rx="6" fill="#34d399" />
  <rect x="145" y="235" width="12" height="85" rx="6" fill="#34d399" />
  
  <!-- BOR Badge inside Fridge -->
  <rect x="230" y="120" width="120" height="42" rx="10" fill="#065f46" stroke="#34d399" stroke-width="3" />
  <text x="290" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">[BOR]</text>

  <!-- Chef Hat / Sparkle Accent -->
  <circle cx="360" cy="100" r="14" fill="#fbbf24" />
  <polygon points="360,70 366,90 386,90 370,102 376,122 360,110 344,122 350,102 334,90 354,90" fill="#f59e0b" />
</svg>
